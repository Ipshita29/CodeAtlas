<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAtlas - Repo Analyzer</title>
</head>
<body>
    <h1>CodeAtlas - Repository Analyzer</h1>
    <p style="color: blue; font-weight: bold; border: 2px solid blue; padding: 10px; display: inline-block;">
        Your Vite server is running at http://localhost:5173.<br>
        The backend is running at http://localhost:5001.
    </p>
    
    <div>
        <h3>Analyze GitHub Repository</h3>
        <input type="text" id="repoUrl" placeholder="Enter GitHub Repo URL" style="width: 300px;">
        <button id="analyzeBtn">Analyze</button>
    </div>

    <hr>

    <div>
        <h3>Upload Project ZIP</h3>
        <input type="file" id="zipFile" accept=".zip">
        <button id="uploadBtn">Upload & Analyze</button>
    </div>

    <hr>
    <div>
        <h3>Project Improvement Suggestions</h3>
        <button id="suggestionsBtn">Get Suggestions</button>
        <ul id="suggestionsList" style="margin-top: 10px; color: #d9534f; font-weight: bold;"></ul>
    </div>
    <hr>

    <h3>Output:</h3>
    <pre id="output" style="background: #f4f4f4; padding: 10px; border: 1px solid #ccc; min-height: 100px; white-space: pre-wrap; word-break: break-all;"></pre>

    <script>
        const output = document.getElementById('output');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const suggestionsBtn = document.getElementById('suggestionsBtn');
        const suggestionsList = document.getElementById('suggestionsList');
        const repoUrlInput = document.getElementById('repoUrl');
        const zipFileInput = document.getElementById('zipFile');

        // Note: Using absolute URL for backend as frontend is served on port 5173 (Vite)
        const BACKEND_URL = 'http://localhost:5001';

        analyzeBtn.addEventListener('click', async () => {
            const repoUrl = repoUrlInput.value;
            if (!repoUrl) {
                alert('Please enter a repo URL');
                return;
            }

            output.textContent = 'Analyzing repository...';

            try {
                const response = await fetch(`${BACKEND_URL}/repo`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ repoUrl })
                });

                const data = await response.json();
                if (data.success) {
                    output.textContent = `Architecture: \n${data.architecture}\n\n`;
                    output.textContent += `README Status: ${data.readmeStatus}\n\n`;
                    if (data.updatedReadme) {
                        output.textContent += `Updated/Generated README:\n${data.updatedReadme}`;
                    }
                } else {
                    output.textContent = 'Error: ' + data.message;
                }
            } catch (err) {
                output.textContent = 'Error: ' + err.message + '\n\nMake sure the backend is running on port 5001.';
            }
        });

        uploadBtn.addEventListener('click', async () => {
            const file = zipFileInput.files[0];
            if (!file) {
                alert('Please select a ZIP file');
                return;
            }

            output.textContent = 'Uploading and analyzing ZIP...';

            const formData = new FormData();
            formData.append('zipFile', file);

            try {
                const response = await fetch(`${BACKEND_URL}/upload`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                if (data.success) {
                    output.textContent = `Architecture: \n${data.architecture}\n\n`;
                    output.textContent += `README Status: ${data.readmeStatus}\n\n`;
                    if (data.updatedReadme) {
                        output.textContent += `Updated/Generated README:\n${data.updatedReadme}`;
                    }
                } else {
                    output.textContent = 'Error: ' + data.message;
                }
            } catch (err) {
                output.textContent = 'Error: ' + err.message + '\n\nMake sure the backend is running on port 5001.';
            }
        });

        suggestionsBtn.addEventListener('click', async () => {
            suggestionsList.innerHTML = '<li>Loading suggestions...</li>';
            try {
                const response = await fetch(`${BACKEND_URL}/suggestions`);
                const data = await response.json();
                
                suggestionsList.innerHTML = '';
                if (data.suggestions && data.suggestions.length > 0) {
                    data.suggestions.forEach(s => {
                        const li = document.createElement('li');
                        li.style.marginBottom = "15px";
                        li.style.listStyleType = "none";
                        li.innerHTML = `<span style="color: #d9534f; font-weight: bold;">• ${s.text}</span>`;
                        
                        if (s.files && s.files.length > 0) {
                            const subUl = document.createElement('ul');
                            subUl.style.marginTop = "5px";
                            subUl.style.marginLeft = "20px";
                            subUl.style.color = "#333";
                            subUl.style.fontWeight = "normal";
                            
                            s.files.forEach(f => {
                                const fileLi = document.createElement('li');
                                fileLi.textContent = f;
                                subUl.appendChild(fileLi);
                            });
                            li.appendChild(subUl);
                        }
                        suggestionsList.appendChild(li);
                    });
                } else {
                    suggestionsList.innerHTML = '<li>No suggestions yet. Analyze a repo first!</li>';
                }
            } catch (err) {
                suggestionsList.innerHTML = '<li>Error fetching suggestions</li>';
            }
        });
    </script>
</body>
</html>
